
    

{% for noticia in noticias %}
    <a href="{{ noticia.get_absolute_url }}" class="card card-horizontal md:card-side bg-base-100 
            shadow-sm hover:shadow-lg transition-shadow duration-300 group border border-base-300/50 
            overflow-hidden w-full max-w-7xl">
        
        <figure class="w-full p-2 md:p-0 md:w-2/5 lg:w-1/3 shrink-0 overflow-hidden bg-base-200">
            {% if noticia.imagen %}
                <img 
                    src="{{ noticia.imagen.url }}" 
                    alt="{{ noticia.titulo }}" 
                    class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 ease-out" 
                />
            {% else %}
                <div class="flex items-center justify-center w-full h-56 md:h-full text-base-content/40">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                </div>
            {% endif %}
        </figure>
        
        <div class="card-body md:w-3/5 lg:w-2/3 p-6 md:p-8">
            <div class="flex items-center gap-3 mb-2">
                <span class="badge badge-primary badge-soft badge-sm">Actualidad</span>
                <time class="text-sm text-base-content/60 font-medium" datetime="{{ noticia.fecha_publicacion|date:'Y-m-d' }}">
                    {{ noticia.fecha_publicacion|date:"d M Y" }}
                </time>
            </div>
            
            <h3 class="card-title text-xl lg:text-2xl font-bold text-base-content group-hover:text-primary transition-colors duration-300">
                {{ noticia.titulo }}
            </h3>
            
            <p class="text-base-content/80 text-sm lg:text-base mt-2 line-clamp-3 leading-relaxed">
                {{ noticia.resumen }}
            </p>
            
            <div class="card-actions justify-end mt-4">
                <span class="text-primary font-semibold text-sm group-hover:underline flex items-center gap-1">
                    Leer la noticia
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transform group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
                </span>
            </div>
        </div>
    </a>

{% empty %}
    <div class="col-span-1 text-center py-12 bg-base-100 rounded-box border-2 border-dashed border-base-300">
        <p class="text-base-content/60 font-medium">No hay noticias publicadas en este momento.</p>
    </div>
{% endfor %}
