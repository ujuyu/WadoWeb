{% for evento in eventos %}
    <article class="m-8 group relative max-w-sm rounded-box transition-all duration-300">
      <!-- Imagen del cartel (Fondo interactivo) -->
      <figure class="size-full overflow-hidden rounded-box shadow-md transition-shadow duration-300 group-hover:shadow-2xl">
        <img src="{{ evento.imagen.url }}"
          alt="Cartel promocional del evento" 
          class="size-full object-cover transition-transform duration-500 ease-out group-hover:scale-105"
          loading="lazy"
        />
      </figure>
      <!-- Cuadro superior izquierdo: Título y metadatos (Sobresaliente) -->
      <header class="bg-base-100/80 absolute -top-8 -left-8 z-10 max-w-[85%] rounded-box border border-base-300 p-4 shadow-xl transition-transform duration-300 group-hover:-translate-y-1">
        <div class="flex items-center gap-2 mb-1.5">
          <span class="badge badge-primary badge-sm font-semibold">{{ evento.tipo }}</span>
          <time datetime="{{ evento.fecha_celebracion|date:'Y-m-d' }}" class="text-xs text-base-content/70 font-medium">
            {{ evento.fecha_celebracion|date:'j M' }} · {{ evento.fecha_celebracion|date:"H:i" }}
          </time>
        </div>
        <h3 id="event-title-1" class="text-xl font-bold text-base-content leading-tight group-hover:text-primary transition-colors">
            {{ evento.titulo }}
        </h3>
      </header>
      <!-- Cuadro inferior derecho: Resumen y acción (Sobresaliente) -->
      <footer class="absolute -bottom-8 -right-8 z-10 max-w-[85%] rounded-box border border-base-300 bg-base-100/80 p-4 shadow-xl transition-transform duration-300 group-hover:translate-y-1">
        <p class="text-s font-medium text-base-content leading-relaxed mb-3 text-justify">
          {{ evento.resumen }}
        </p>
        <div class="flex items-center justify-between gap-3">
          <span class="text-xs font-semibold text-base-content">
            {% if evento.plazas %}(plazas: {{ evento.plazas }}){% endif %}
          </span>
          <a 
            href="#" 
            class="btn btn-primary btn-sm rounded-field hover:scale-105 active:scale-95 transition-transform"
            aria-labelledby="event-title-1"
          >
            Inscribirme
          </a>
        </div>
      </footer>
    </article>
{% empty %}
    <p>No hay eventos.</p>
{% endfor %}
